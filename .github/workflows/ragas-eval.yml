name: RAG Quality Gates

on:
  push:
    branches: [main, hw10]
    paths:
      - "hw_09/**"
  pull_request:
    branches: [main, hw10]
    paths:
      - "hw_09/**"
  workflow_dispatch:  # позволяет запускать вручную из GitHub UI

jobs:
  # ── 1. Быстрые unit-тесты (без LLM, запускаются всегда) ─────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: hw_09/requirements.txt

      - name: Install dependencies
        run: pip install -r hw_09/requirements.txt

      - name: Download NLTK data
        run: python -c "import nltk; nltk.download('punkt'); nltk.download('stopwords')"

      - name: Run unit tests
        run: pytest hw_09/tests/test_unit.py -v --tb=short

  # ── 2. Ragas evaluation (quality gates) ──────────────────────────────────
  ragas-eval:
    name: Ragas Evaluation
    runs-on: ubuntu-latest
    needs: unit-tests          # запускается только если unit-тесты прошли

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}   # если используется кастомный endpoint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: hw_09/requirements.txt

      - name: Install dependencies
        run: pip install -r hw_09/requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-large

      - name: Download NLTK data
        run: python -c "import nltk; nltk.download('punkt'); nltk.download('stopwords')"

      - name: Run Ragas evaluation (quality gates)
        run: pytest hw_09/tests/test_ragas.py -v --tb=short
        # Пайплайн упадёт (exit code != 0) если любой из трёх тестов не пройдёт порог:
        #   faithfulness     >= 0.9
        #   answer_relevancy >= 0.7
        #   context_recall   >= 0.8

      - name: Generate HTML report
        if: always()
        run: python hw_09/tests/generate_report.py

      - name: Upload evaluation results
        if: always()   # сохраняем артефакт даже при падении теста
        uses: actions/upload-artifact@v4
        with:
          name: ragas-results
          path: |
            hw_09/tests/results.json
            hw_09/tests/report.html
          retention-days: 30

      # Опционально: публикуем результаты как summary в GitHub UI
      - name: Post results summary
        if: always()
        run: |
          python - <<'EOF'
          import json, os
          path = "hw_09/tests/results.json"
          if not os.path.exists(path):
              print("results.json not found")
              exit(0)
          with open(path) as f:
              data = json.load(f)
          scores = data.get("scores", {})
          thresholds = {"faithfulness": 0.9, "answer_relevancy": 0.7, "context_recall": 0.8}
          lines = ["## Ragas Evaluation Results\n", "| Metric | Score | Threshold | Status |",
                   "|--------|-------|-----------|--------|"]
          for metric, score in scores.items():
              t = thresholds.get(metric, 0)
              status = "✅ PASS" if score >= t else "❌ FAIL"
              lines.append(f"| {metric} | {score:.3f} | {t} | {status} |")
          summary = "\n".join(lines)
          print(summary)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(summary_path, "a") as f:
              f.write(summary + "\n")
          EOF
